when:
  - event: push
    branch: master
  - event: manual

engine: microvm
image: nixos
dependencies:
  - jdk25

environment:
  GRADLE_USER_HOME: .gradle-home

# gradle always takes ages to download the wrapper
cache:
  - key: gradle-deps
    hash:
      - build.gradle
      - settings.gradle
    paths:
      - .gradle-home/caches
  - key: gradle-dist
    hash:
      - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/wrapper


steps:
  - name: "build mod"
    command: "./gradlew build --build-cache"

# if tangled ever adds it, add another step here for ci artifacts

