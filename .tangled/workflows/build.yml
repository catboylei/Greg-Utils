when:
  - event: push
    branch: master
  - event: manual

engine: microvm
image: nixos
dependencies:
  - jdk25

environment:
  GRADLE_USER_HOME: .gradle-home
  REMOTE: catboylei.bsky.social@tangled.org:catboylei.bsky.social/Greg-Utils

# gradle always takes ages to download the wrapper
cache:
  - key: gradle-deps
    hash:
      - build.gradle
      - settings.gradle
    paths:
      - .gradle-home/caches
  - key: gradle-dist
    hash:
      - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/wrapper

# also build with release property to strip debug

steps:
  - name: "set up ssh"
    command: |
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      printf '%s\n' "$CI_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan tangled.org >> ~/.ssh/known_hosts
      git remote set-url origin "$REMOTE"
      git config user.name "greg"
      git config user.email "greg-utils-ci@invalid"

  - name: "remove tag"
    command: "sh \"removeTag.sh\" nightly-117 $REMOTE"

  - name: "build mod"
    command: "./gradlew build --build-cache -Prelease --rerun-tasks"

# if tangled ever adds it, add another step here for ci artifacts