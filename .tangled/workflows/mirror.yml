when:
  - event: ["push"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - git
    - openssh

steps:
  - name: mirror to github
    command: |
      mkdir -p ~/.ssh
      echo "$GITHUB_MIRROR_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan github.com >> ~/.ssh/known_hosts

      git clone --mirror https://tangled.org/catboylei.bsky.social/greg-utils
      cd repo.git
      git push --mirror https://github.com/catboylei/Greg-Utils